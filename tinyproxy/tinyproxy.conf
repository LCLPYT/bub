Port 8888
Timeout 900
MaxClients 100
# Connect logs every request, which is handy while building the allowlist; Notice later
LogLevel Connect
DisableViaHeader Yes
StatHost "tinyproxy.stats"
# No LogFile or Syslog lines, so it logs to stdout (journalctl)

Allow 127.0.0.1

FilterDefaultDeny Yes
Filter "/etc/tinyproxy/allow"
ConnectPort 443
